services:
  coredns:
    image: coredns/coredns:1.11.1
    container_name: coredns
    networks:
      - gpnetwork
    volumes:
      - ./coredns/Corefile:/Corefile:Z
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    command: -conf /Corefile
    restart: unless-stopped

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    networks:
      - gpnetwork
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.goproject.local`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:Z
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:Z
      - /var/run/docker.sock:/var/run/docker.sock:Z
      - ./certs:/certs:Z

networks:
  gpnetwork:
    external: true
    name: gpnetwork
